<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}{% endblock %}</title>
    <style>
        body { background: #eef; font-family: sans-serif; margin: 30px; }
        table { border-collapse: collapse; background: white; }
        td, th { border: 1px solid #999; padding: 6px 12px; }
        .msg { color: darkgreen; }
    </style>
</head>
<body>
    <h1>Employee Attendance</h1>
    <p><a href="/">Home</a> | <a href="/employees">Employees</a> | <a href="/report">Report</a></p>
    {% with messages = get_flashed_messages() %}
        {% for m in messages %}<p class="msg">{{ m }}</p>{% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
</body>
</html>
